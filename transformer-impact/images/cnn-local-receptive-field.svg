<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#f8fafc"/>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#16324f }
    .title { font-size:34px; font-weight:700 }
    .label { font-size:24px; font-weight:600 }
    .note { font-size:20px; fill:#526579 }
    .panel { fill:#fff; stroke:#cbd5e1; stroke-width:2 }
    .grid { stroke:#cbd5e1; stroke-width:1 }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <pattern id="smallGrid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" class="grid"/></pattern>
  </defs>
  <text x="600" y="52" text-anchor="middle" class="title">CNN：局部观察，逐层扩大视野</text>
  <rect x="45" y="90" width="310" height="350" rx="18" class="panel"/>
  <text x="200" y="130" text-anchor="middle" class="label">第 1 层</text>
  <rect x="80" y="155" width="240" height="240" fill="url(#smallGrid)" stroke="#94a3b8"/>
  <rect x="80" y="155" width="90" height="90" fill="#fb923c" fill-opacity=".65" stroke="#ea580c" stroke-width="4"/>
  <text x="200" y="425" text-anchor="middle" class="note">一次只看一小块</text>
  <line x1="365" y1="265" x2="425" y2="265" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="445" y="90" width="310" height="350" rx="18" class="panel"/>
  <text x="600" y="130" text-anchor="middle" class="label">叠加多层</text>
  <rect x="480" y="155" width="240" height="240" fill="url(#smallGrid)" stroke="#94a3b8"/>
  <rect x="480" y="155" width="150" height="150" fill="#38bdf8" fill-opacity=".35" stroke="#0284c7" stroke-width="4"/>
  <rect x="540" y="215" width="150" height="150" fill="#fb923c" fill-opacity=".35" stroke="#ea580c" stroke-width="4"/>
  <text x="600" y="425" text-anchor="middle" class="note">相邻区域逐层传递信息</text>
  <line x1="765" y1="265" x2="825" y2="265" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="845" y="90" width="310" height="350" rx="18" class="panel"/>
  <text x="1000" y="130" text-anchor="middle" class="label">多层之后</text>
  <rect x="880" y="155" width="240" height="240" fill="url(#smallGrid)" stroke="#94a3b8"/>
  <circle cx="910" cy="185" r="18" fill="#f97316"/>
  <circle cx="1090" cy="365" r="18" fill="#0ea5e9"/>
  <path d="M925 200 C980 210,1020 310,1075 350" fill="none" stroke="#2563eb" stroke-width="7" stroke-dasharray="12 8" marker-end="url(#arrow)"/>
  <rect x="880" y="155" width="240" height="240" fill="#60a5fa" fill-opacity=".12" stroke="#2563eb" stroke-width="4"/>
  <text x="1000" y="425" text-anchor="middle" class="note">远处特征终于联系起来</text>
  <text x="600" y="490" text-anchor="middle" class="note">距离越远，通常需要经过越多层；不是“看不见”，而是信息路径更长。</text>
</svg>
