<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#f8fafc"/>
  <style>
    text { font-family:"Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#16324f }
    .title { font-size:34px; font-weight:700 }
    .word { font-size:21px; font-weight:600 }
    .note { font-size:20px; fill:#526579 }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
  <text x="600" y="55" text-anchor="middle" class="title">RNN：逐词阅读，记忆沿着时间传递</text>
  <g>
    <rect x="40" y="135" width="150" height="100" rx="16" fill="#22c55e"/><text x="115" y="195" text-anchor="middle" fill="white" class="word">树</text>
    <line x1="195" y1="185" x2="245" y2="185" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="260" y="135" width="170" height="100" rx="16" fill="#86c99a"/><text x="345" y="195" text-anchor="middle" class="word">经过许多年</text>
    <line x1="435" y1="185" x2="485" y2="185" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="500" y="135" width="170" height="100" rx="16" fill="#b7d5bf"/><text x="585" y="195" text-anchor="middle" class="word">风吹雨打</text>
    <line x1="675" y1="185" x2="725" y2="185" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="740" y="135" width="190" height="100" rx="16" fill="#d7dfd9"/><text x="835" y="195" text-anchor="middle" class="word">长得很高大</text>
    <line x1="935" y1="185" x2="985" y2="185" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="1000" y="135" width="150" height="100" rx="16" fill="#e5e7eb" stroke="#94a3b8" stroke-width="2"/><text x="1075" y="195" text-anchor="middle" class="word">倒了</text>
  </g>
  <path d="M115 270 C330 350,770 350,1075 270" fill="none" stroke="#16a34a" stroke-width="14" opacity=".15"/>
  <circle cx="210" cy="318" r="14" fill="#22c55e"/><circle cx="390" cy="344" r="11" fill="#75b987"/><circle cx="585" cy="350" r="8" fill="#a7c4ae"/><circle cx="780" cy="337" r="5" fill="#cbd5ce"/><circle cx="960" cy="300" r="3" fill="#e5e7eb"/>
  <text x="600" y="395" text-anchor="middle" class="note">“树”的早期信息经过很多步骤后，可能逐渐变淡</text>
  <g transform="translate(185 430)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#f59e0b" stroke-width="5"/><path d="M0 0V-12M0 0L10 7" stroke="#f59e0b" stroke-width="4"/>
    <text x="45" y="7" class="note">第 2 步必须等待第 1 步完成，第 3 步再等待第 2 步——难以同时计算。</text>
  </g>
</svg>
